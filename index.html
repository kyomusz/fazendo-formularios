<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
<header class="cabecalho">
    <h1 class="tituloprincipal">
        formulario da Kana
    </h1>
</header>

<main class="principal">
<form class="formulario">
   <h2 class="tituloformulario">
    Login
   </h2>
   <div class="caixaCamp">
    <label class="rotuloCampo" for="nomeCampo">
        Nome
    </label>
    <input type="text" id="nomeCampo" class="campoFormulario" placeholder="Digite seu nome">
   </div>

   <div class="caixaCamp">
    <label class="rotuloCampo" for="nomeCampo">
        Email
    </label>
    <input type="email" id="nomeCampo" class="campoFormulario" placeholder="Digite seu email">
   </div>

   <div class="caixaCamp">
    <label class="rotuloCampo" for="nomeCampo">
        Senha
    </label>
    <input type="password" id="nomeCampo" class="campoFormulario" placeholder="Digite sua senha">
   </div>
   <button class="btnEnviar">
    Enviar
   </button>
</form>
</main>

</body>
</html>
